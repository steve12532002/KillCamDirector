; Starts from the side and slowly swings round to the front of your character's face.
; Anchor=player: Yaw is measured from the way your body faces (90 = side, 180 = in front of your face),
; so this works for front and back killmoves alike. Turns ~70 degrees over 7 seconds - gentle.
[Preset]
Name=Face Reveal
Letterbox=0.10

[Shot1]
Duration=7
Anchor=player
Yaw=95,165
Distance=180,150
Height=10,18
LookAt=0.3
Side=random
Blend=0.4

[Shot2]
Duration=30
Anchor=player
Yaw=165,175
Distance=150,145
Height=18,20
LookAt=0.3
Side=same
Blend=1.0
