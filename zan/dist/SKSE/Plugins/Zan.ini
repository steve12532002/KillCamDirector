; Zan (斬) - defaults. Changes made in the SKSE Menu Framework page go to Zan_User.ini.
[General]
bEnabled = true
; DirectInput scan code (0x2F = 47 = V). Mouse buttons are 256+.
iExecuteKey = 47
; enemies at or below this share of health are executable (0.25 = 25%)
fHealthThreshold = 0.25
fRange = 260
fCone = 70
bHumanoidOnly = true
; the key also swings at the target
bAutoAttack = true
; seconds the game gets to start the killmove
fWindow = 2.5

[Random]
; relative weights per source (0 = never)
iVanilla = 1
iLowBlow = 1
iThicc = 1
; the last N animations are skipped while others are usable
iNoRepeat = 4

[Marker]
bEnabled = true
fSize = 26
fOffsetX = 70
fOffsetY = 0
fHeight = 28
iRed = 255
iGreen = 110
iBlue = 110

[Debug]
bVerbose = false
