; Execution Director - press a key to execute weakened enemies with any loaded killmove animation.
; Changes made in the SKSE Menu Framework pages are saved to ExecutionDirector_User.ini.

[General]
bEnabled=1
; Execute key (DirectInput scan code; mouse buttons are 256+). 47 = V, 34 = G, 33 = F, 19 = R, 258 = middle mouse.
; Easier: Settings page > Change key, then press the key you want.
iExecuteKey=47
; Enemies at or below this fraction of their health become executable (0.25 = 25%)
fHealthThreshold=0.25
; How close (game units, ~1.4 cm each) and how far off to the side (degrees) the target may be
fExecuteRange=280
fExecuteCone=75
; Enemies further than this are not marked
fMarkRange=3000
; Stop the game picking killmoves at random when YOU land a killing blow. NPC killmoves are not affected.
bBlockRandomPlayerKillmoves=1
; Only humanoid enemies (ActorTypeNPC) can be executed
bHumanoidOnly=1
bAllowEssential=0
; If the victim is still alive when the animation ends, finish them
bEnsureKill=1
; How many different animations to try if one refuses to start
iMaxRetries=3
; Prefer animations tagged for the weapon you are holding (others are still used if none match)
bPreferWeaponMatch=1
; Honour "female attacker only" style tags (e.g. Thicc Thighs Take Lives)
bRespectSexTags=1
bNotifications=1

[Stagger]
; Executable enemies reel from a stagger now and then, so you have time to reach them
bEnabled=1
fInterval=2.5
fMagnitude=0.8
; Only for this many seconds after they become executable
fWindow=10

[Marker]
bEnabled=1
; Text drawn next to the enemy's health bar (UTF-8)
sText=殺
fSize=28
; Pixel offset from the point above the head (TrueHUD's bar sits there, so the default is to its right)
fOffsetX=70
fOffsetY=0
; Game units above the head bone
fHeight=28
iRed=255
iGreen=110
iBlue=110

[Debug]
bVerbose=0
