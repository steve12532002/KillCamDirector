name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" | Out-Null
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -- -k 0 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report errors as annotations
        if: failure()
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @('configure.log', 'build.log')) {
            if (Test-Path $f) { $lines += Get-Content $f | Where-Object { $_ -match 'error|Error|CMake Error|FAILED' } }
          }
          $lines = $lines | Select-Object -Unique | Select-Object -First 120
          $chunks = [math]::Ceiling($lines.Count / 12)
          for ($i = 0; $i -lt [math]::Min($chunks, 10); $i++) {
            $part = ($lines | Select-Object -Skip ($i * 12) -First 12) -join '%0A'
            Write-Output "::error title=log part $($i + 1)::$part"
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path "$out/SKSE/Plugins" | Out-Null
          Copy-Item -Recurse -Force dist/* $out/
          Copy-Item build/KillCamDirector.dll "$out/SKSE/Plugins/"
          Copy-Item LICENSE, README.md "$out/"
          $ed = "$out/ExecutionDirector"
          New-Item -ItemType Directory -Force -Path "$ed/SKSE/Plugins" | Out-Null
          Copy-Item -Recurse -Force execution/dist/* $ed/
          Copy-Item build/ExecutionDirector.dll "$ed/SKSE/Plugins/"
          Copy-Item LICENSE "$ed/"

      - uses: actions/upload-artifact@v4
        with:
          name: KillCamDirector
          path: package/

      - name: Publish package to the 'build' branch
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          Set-Location package
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "Built from $sha" | Out-File -Encoding utf8 BUILD_INFO.txt
          git add -A
          git commit -q -m "Build of $sha"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
