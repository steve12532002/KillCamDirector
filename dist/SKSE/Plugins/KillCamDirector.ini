; KillCam Director - cinematic camera for killmoves the player takes part in.
; Changes made in the SKSE Menu Framework page are saved to KillCamDirector_User.ini.

[General]
bEnabled=1
; Preset name (as written in the preset's Name= line) or Random
sPreset=Random
; DirectInput scan codes. 210 = Insert, 201 = Page Up, 0 = disabled
iToggleKey=210
iNextPresetKey=201
bNotifications=1
; Switch to third person for the killmove if you were in first person
bForceThirdPerson=1
; How far away (game units) the other actor in the killmove can be
fMaxPartnerDistance=600
; Camera follow smoothing in seconds (smaller = tighter)
fSmoothing=0.10
; Seconds to glide back to the normal camera after the killmove
fBlendOut=0.45
; Seconds the killmove must be over before the camera lets go (stops flicker between animations)
fStopDelay=0.30

[Override]
; Letterbox bar height as a fraction of the screen (0.10 = 10%). -1 = use each preset's own value
fLetterbox=-1

[SlowMotion]
; Applies to every preset. 0 = off, 1 = slow down on each hit / kill (finisher), 2 = whole killmove
iMode=1
; Game speed while slowed (0.25 = quarter speed)
fScale=0.25
; Real seconds of slow motion per hit (mode 1)
fDuration=0.9

[Debug]
; -1 = auto-detect camera axes (recommended), 0 or 1 = force a convention if the view points the wrong way
iAxisMode=-1
bVerbose=0
