; Slow orbit around both fighters from the side.
; Yaw: 0 = behind you looking at the enemy, 90 = side-on, 180 = behind the enemy looking at you.
; Every "a,b" value animates from a to b during the shot.
[Preset]
Name=Orbit
Letterbox=0.10
SlowMotion=1
SlowScale=0.4
SlowOnHit=1
SlowDuration=0.6

[Shot1]
Duration=2.5
Yaw=70,110
Distance=190,160
Height=10,20
LookAt=0.5
Side=random
Blend=0.35

[Shot2]
Duration=30
Yaw=110,150
Distance=160,210
Height=20,45
LookAt=0.5
Side=same
Blend=0.8
